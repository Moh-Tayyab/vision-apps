worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream for the Flask/Gunicorn backend
    upstream app_server {
        server truck-loading:5000;
    }

    # MJPEG proxy settings — disable all buffering for real-time streaming
    proxy_buffering off;
    proxy_cache off;

    server {
        listen 80;
        server_name _;

        # Max upload size (must match MAX_UPLOAD_MB in the app)
        client_max_body_size 500M;

        # MJPEG video feed — zero buffering
        location /video_feed {
            proxy_pass http://app_server/video_feed;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Keep connection alive for persistent MJPEG stream
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # All other routes
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }
    }
}
