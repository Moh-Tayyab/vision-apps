worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream for the Flask/Gunicorn backend (bound to localhost / container network)
    upstream app_server {
        server truck-loading:5000;
        keepalive 32;
    }

    # MJPEG proxy settings — disable all buffering for real-time streaming
    proxy_buffering off;
    proxy_cache off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name _;

        # Max upload size (must match MAX_UPLOAD_MB in the app)
        client_max_body_size 500M;

        # Health check endpoint
        location /health {
            proxy_pass http://app_server/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # MJPEG video feed — zero buffering
        location /video_feed {
            proxy_pass http://app_server/video_feed;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Keep connection alive for persistent MJPEG stream
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # All other routes
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }
    }

    # Optional HTTPS Server block (if TLS certificates are mounted to /etc/nginx/certs)
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #     ssl_certificate /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     client_max_body_size 500M;
    #     location / {
    #         proxy_pass http://app_server;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}
