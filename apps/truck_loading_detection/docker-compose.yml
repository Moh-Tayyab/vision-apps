services:
  truck-loading:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truck-loading-detection
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - WORKERS=1
      - TORCH_THREADS=4
      - CONF_THRESHOLD=0.24
      - IOU_THRESHOLD=0.45
      - IMG_SIZE=416
      - FRAME_STRIDE=2
      - MAX_UPLOAD_MB=500
      - JPEG_QUALITY=70
      # Set an RTSP camera URL for live production feeds:
      # - VIDEO_SOURCE=rtsp://admin:password@192.168.1.100:554/stream1
    volumes:
      - uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: truck-loading-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - truck-loading

volumes:
  uploads:
