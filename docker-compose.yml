services:
  # App 1: Carton Counter & Truck Loading Detection (Multi-Angle Fusion)
  carton_counter:
    build:
      context: ./apps/truck_loading_detection
      dockerfile: Dockerfile
    container_name: carton_counter_service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - WORKERS=1
      - TORCH_THREADS=4
      - CONF_THRESHOLD=0.24
      - IOU_THRESHOLD=0.45
      - FRAME_STRIDE=2
      - JPEG_QUALITY=70
    volumes:
      - carton_uploads:/app/uploads
      - ./apps/truck_loading_detection/output_videos:/app/output_videos
      - ./apps/truck_loading_detection/recorded_video:/app/recorded_video:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # App 2: Helmet / PPE Safety Compliance Detection
  helmet_detection:
    build:
      context: ./apps/helmet_detection
      dockerfile: Dockerfile
    container_name: helmet_detection_service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MODEL_PATH=ppe-detection-best.pt
      - CONF_THRESHOLD=0.35
    restart: unless-stopped

  # App 3: Face Authorization & Biometric Access Control
  face_authorization:
    build:
      context: ./apps/face_authorization
      dockerfile: Dockerfile
    container_name: face_authorization_service
    ports:
      - "8003:8003"
      - "8445:8445"
    environment:
      - PORT=8003
      - HTTPS_PORT=8445
      - QDRANT_URL=http://face_auth_qdrant:6333
      - DEEPFACE_HOME=/app/.deepface
      - DATA_DIR=/app/data
    volumes:
      - face_auth_data:/app/data
      - face_auth_deepface:/app/.deepface
      - face_auth_certs:/app/certs
    depends_on:
      - face_auth_qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vector Database for Face Embeddings
  face_auth_qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: face_auth_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  carton_uploads:
  face_auth_data:
  face_auth_deepface:
  face_auth_certs:
  qdrant_storage:
