# All 3 independent apps. Each has its own build context, image and port —
# no shared runtime coupling.
#
#   App 1  carton-counter       http://localhost:8001
#   App 2  helmet-detection     http://localhost:8002
#   App 3  face-authorization   http://localhost:8003
#
# Roboflow cloud backends read ROBOFLOW_API_KEY from the root .env file.

services:
  carton-counter:
    build: ./apps/carton_counter
    container_name: carton-counter
    ports:
      - "8001:8000"
    environment:
      - MODEL_BACKEND=roboflow
      - ROBOFLOW_MODEL_URL=https://detect.roboflow.com/carton-counter-demo/7
      - CONF_THRESHOLD=0.36
      - PORT=8000
    env_file:
      - .env
    restart: unless-stopped

  helmet-detection:
    build: ./apps/helmet_detection
    container_name: helmet-detection
    ports:
      - "8002:8002"
    environment:
      - MODEL_BACKEND=roboflow
      - ROBOFLOW_MODEL_URL=https://detect.roboflow.com/safety-helmet-dataset-uvh1t-aavk1/1
      - CONF_THRESHOLD=0.35
      - PORT=8002
    env_file:
      - .env
    restart: unless-stopped

  face-authorization:
    build: ./apps/face_authorization
    container_name: face-authorization
    ports:
      - "8003:8003"
    volumes:
      - face-data:/app/data          # enrolled embeddings
      - face-models:/app/.deepface   # deepface model weights cache
    restart: unless-stopped

volumes:
  face-data:
  face-models:
